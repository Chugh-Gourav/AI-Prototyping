name: Deploy PM Learning Hub to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
          
      - name: Install dependencies & Build
        env:
          VITE_API_URL: https://pm-learning-hub-595396735241.us-central1.run.app
        run: |
          if [ -d "PM-AI-Agent/frontend" ]; then
            cd PM-AI-Agent/frontend
          elif [ -d "frontend" ]; then
            cd frontend
          elif [ -d "PM-AI-Agent/bookmark-ui" ]; then
            cd PM-AI-Agent/bookmark-ui
          fi
          npm ci
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './PM-AI-Agent/frontend/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
